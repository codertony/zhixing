# 知行平台 K8s 部署配置
# 用于生产环境或远程 K8s 集群部署

apiVersion: v1
kind: Namespace
metadata:
  name: zhixing
  labels:
    app: zhixing
---
# PostgreSQL Secret
apiVersion: v1
kind: Secret
metadata:
  name: zhixing-postgres-secret
  namespace: zhixing
type: Opaque
stringData:
  POSTGRES_USER: zhixing
  POSTGRES_PASSWORD: zhixing_prod_password_change_me
  POSTGRES_DB: zhixing
---
# PostgreSQL PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zhixing-postgres-pvc
  namespace: zhixing
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard  # 根据集群配置调整
---
# PostgreSQL Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zhixing-postgres
  namespace: zhixing
  labels:
    app: zhixing
    component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zhixing
      component: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: zhixing
        component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: zhixing-postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zhixing-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: zhixing-postgres-secret
                  key: POSTGRES_DB
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - zhixing
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - zhixing
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: zhixing-postgres-pvc
---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: zhixing-postgres
  namespace: zhixing
  labels:
    app: zhixing
    component: postgres
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: zhixing
    component: postgres
---
# Qdrant PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zhixing-qdrant-pvc
  namespace: zhixing
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
---
# Qdrant Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zhixing-qdrant
  namespace: zhixing
  labels:
    app: zhixing
    component: qdrant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zhixing
      component: qdrant
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: zhixing
        component: qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:latest
          ports:
            - containerPort: 6333
              name: rest
            - containerPort: 6334
              name: grpc
          volumeMounts:
            - name: qdrant-data
              mountPath: /qdrant/storage
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 6333
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 6333
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: qdrant-data
          persistentVolumeClaim:
            claimName: zhixing-qdrant-pvc
---
# Qdrant Service
apiVersion: v1
kind: Service
metadata:
  name: zhixing-qdrant
  namespace: zhixing
  labels:
    app: zhixing
    component: qdrant
spec:
  ports:
    - port: 6333
      targetPort: 6333
      name: rest
    - port: 6334
      targetPort: 6334
      name: grpc
  selector:
    app: zhixing
    component: qdrant
